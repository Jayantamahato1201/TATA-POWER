      M 256 90
      C 375 90, 400 135, 400 185
      C 400 235, 375 280, 256 280
      C 137 280, 112 235, 112 185
      C 112 135, 137 90, 256 90 Z

      M 124 186
      C 124 165, 142 143, 245 137
