      L 267 272
      C 292 270, 310 245, 310 205
      C 310 165, 337 155, 388 155
      C 388 166, 388 176, 388 186 Z
    " opacity="0"/>
    
    <!-- Precision Tata Emblem Render -->
    <!-- Outer Oval Base -->
    <ellipse cx="256" cy="180" rx="142" ry="92" fill="#205CA5" />
    
    <!-- White stylization cutouts matching the exact Tata emblem geometry -->
    <!-- Left white curve cutout -->
