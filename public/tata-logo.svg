    <path fill="#FFFFFF" d="
      M 118 150
      C 160 136, 215 130, 256 130
      C 297 130, 352 136, 394 150
      C 396 156, 390 162, 376 160
      C 336 152, 285 146, 259 146
      L 259 272
      L 253 272
      L 253 146
      C 227 146, 176 152, 136 160
      C 122 162, 116 156, 118 150 Z
    " />

    <!-- Exact T A T A Wordmark (Chevron A without crossbar) -->
    <!-- First 'T' -->
    <path d="M 64 326 L 152 326 L 152 355 L 122 355 L 122 422 L 94 422 L 94 355 L 64 355 Z" />

    <!-- First 'A' (Iconic chevron/lambda style, open center, no crossbar) -->
    <path d="M 172 422 L 145 422 L 194 326 L 222 326 L 271 422 L 244 422 L 208 350 Z" />

